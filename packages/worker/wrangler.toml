name = "ccr-router"
main = "src/index.ts"
compatibility_date = "2024-01-01"
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "pigeon-router"
database_id = "082ab39f-34e4-47d9-8d2e-9b064667648e"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pigeon-media"

[triggers]
crons = ["0 * * * *"]

[vars]
# keep_vars = true keeps any plain var that is deployed but no longer listed here. To REMOVE one
# (as pigeon-4ogz.26 did for the Telegram vars): copy this file with keep_vars = false, run
# `wrangler versions upload -c <copy>`, check `wrangler versions view <id> --json` lists every
# secret (versions upload keeps secrets), then `wrangler versions deploy <id>@100%`. NEVER run
# `wrangler deploy` with keep_vars = false: wrangler then drops the SECRETS too (SLACK_WORKSPACE_*,
# CCR_API_KEY), which takes every machine off the chat.
# Retire the shared CCR_API_KEY for these machines (pigeon-k0qn.8): it can no longer poll, ack,
# register or unregister as them, which only their own per-machine keys may do. Other routes
# still accept it. To un-retire a machine, EDIT this list and redeploy; never delete the line,
# because keep_vars = true would keep the deployed value. Runbook:
# docs/runbooks/per-machine-credentials.md.
SHARED_KEY_REFUSED_MACHINES = "cloudbox,devbox,macbook"
# SLACK_NOTIFY_OWNER (optional, deliberately NOT set here; the default is empty): which Slack posts
# @-mention the workspace owner. Comma list of questions, errors, named, alerts (case-insensitive;
# unknown entries ignored). Empty or unset = no mention at all, so Slack pushes are off. Set it
# in the Cloudflare dashboard or with `wrangler secret put SLACK_NOTIFY_OWNER`. keep_vars = true
# keeps whatever is deployed. See packages/worker/src/chat/slack-notify.ts.

[observability]
enabled = true
head_sampling_rate = 1
